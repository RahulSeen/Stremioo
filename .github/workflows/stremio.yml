name: Stremio APK releases

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch: {}       # lets you run it manually

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Find latest stable builds on stremio.com
        run: |
          cat > find.js <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const targets = [
            { panel: '#android-mobile', folder: 'android',   tagPrefix: 'mobile-v', titleName: 'Stremio Mobile' },
            { panel: '#android-tv',     folder: 'androidTV', tagPrefix: 'tv-v',     titleName: 'Stremio Android TV' },
          ];
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.goto('https://www.stremio.com/downloads', { waitUntil: 'networkidle' });
            await page.waitForTimeout(5000);
            const out = [];
            for (const t of targets) {
              const hrefs = await page.$$eval(`${t.panel} a`, as => as.map(a => a.href));
              // stable folders only, e.g. v2.5.1-android (no beta / rc)
              const re = new RegExp(`/v(\\d+\\.\\d+\\.\\d+)-${t.folder}/`);
              const stable = hrefs.filter(h => re.test(h) && /\.apk$/.test(h));
              if (!stable.length) { console.error('Nothing found for', t.panel, hrefs); process.exit(1); }
              const version = stable[0].match(re)[1];   // first stable entry = Latest
              const urls = stable.filter(h => h.includes(`/v${version}-${t.folder}/`) &&
                                              /(arm64-v8a|armeabi-v7a)\.apk$/.test(h));
              out.push({ tag: t.tagPrefix + version, title: `${t.titleName} ${version}`, version, urls });
              console.log(t.titleName, version, urls);
            }
            await browser.close();
            fs.writeFileSync('releases.json', JSON.stringify(out));
          })();
          EOF
          node find.js

      - name: Create releases that are new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -c '.[]' releases.json | while read -r item; do
            tag=$(echo "$item" | jq -r .tag)
            title=$(echo "$item" | jq -r .title)
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "$tag already released, skipping."
              continue
            fi
            mkdir -p "dl-$tag"
            for url in $(echo "$item" | jq -r '.urls[]'); do
              curl -fL -o "dl-$tag/$(basename "$url")" "$url"
            done
            gh release create "$tag" dl-$tag/*.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes "Mirror of the official Stremio APKs (arm64-v8a and armeabi-v7a)."
          done
